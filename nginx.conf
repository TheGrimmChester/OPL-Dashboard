server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; connect-src 'self' http://127.0.0.1:8092 http://localhost:8092 http://127.0.0.1:8080 http://localhost:8080 http://127.0.0.1:8088 http://localhost:8088 ws: wss:" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Docker DNS — resolve at request time so missing upstreams do not fail nginx boot.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Co-deployed: same-origin bridge to OAM for browser login.
    # Product /api/auth/login remains on opl-api and correctly returns 503.
    location /oam-auth/ {
        set $oam_api_upstream http://oam-api:8090;
        rewrite ^/oam-auth/(.*)$ /$1 break;
        proxy_pass $oam_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Co-deployed: same-origin bridge to OPA-Hub for browser login/OIDC.
    # Product /api/auth/login remains on opl-api and correctly returns 503.
    location /hub-auth/ {
        set $opa_hub_upstream http://hub:8080;
        rewrite ^/hub-auth/(.*)$ /$1 break;
        proxy_pass $opa_hub_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Product API (opl-api / Open Perf Lab). Prefer compose service name opl-api.
    location /api/ {
        set $opl_api_upstream http://opl-api:8092;
        proxy_pass $opl_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 32m;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
